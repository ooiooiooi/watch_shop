worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    http2 on;

    # Rate limiting zone for API endpoints to prevent aggressive scraping
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Map block for identifying malicious/illegal crawlers
    map $http_user_agent $bad_bot {
        default 0;
        # Block common scrapers, scripts, and aggressive marketing bots
        ~*(Scrapy|python-requests|urllib|Go-http-client|Java/|libwww-perl|wget|curl|SemrushBot|AhrefsBot|MJ12bot|DotBot|PetalBot|Bytespider|DataForSeoBot|Barkrowler|BLEXBot|MegaIndex) 1;
    }

    server {
        listen       80;
        server_name  vsfactoryy.com www.vsfactoryy.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen       80;
        server_name  vs.vsfactoryy.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen       443 ssl;
        server_name  vsfactoryy.com www.vsfactoryy.com;

        ssl_certificate      /etc/letsencrypt/live/vsfactoryy.com/fullchain.pem;
        ssl_certificate_key  /etc/letsencrypt/live/vsfactoryy.com/privkey.pem;

        ssl_session_timeout  5m;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_tickets  off;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Block malicious bots globally
        if ($bad_bot) {
            return 403;
        }

        location / {
            root   /www/wwwroot/vsfactory;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            # Apply rate limiting to API
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://127.0.0.1:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            proxy_pass http://127.0.0.1:8080/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /admin {
            return 301 https://vs.vsfactoryy.com/;
        }
    }

    server {
        listen       443 ssl;
        server_name  vs.vsfactoryy.com;

        ssl_certificate      /etc/letsencrypt/live/vsfactoryy.com/fullchain.pem;
        ssl_certificate_key  /etc/letsencrypt/live/vsfactoryy.com/privkey.pem;

        ssl_session_timeout  5m;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_tickets  off;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Block malicious bots globally
        if ($bad_bot) {
            return 403;
        }

        location / {
            root   /www/wwwroot/vsfactory/admin;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            # Apply rate limiting to API
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://127.0.0.1:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            proxy_pass http://127.0.0.1:8080/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
